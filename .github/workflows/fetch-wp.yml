# Разовая выгрузка с WordPress: CSS Elementor (фоны и фото блоков) и все картинки.
# Запускается вручную: Actions → fetch-wp → Run workflow.
name: fetch-wp
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fetch-wp.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать CSS Elementor
        run: |
          mkdir -p src/wp/css
          ids="144 1290 1420 1423 1429 1433 1437 1441 1445 1449 1578 1579 2174 2515 2880 3071 4314 4324 4761 5004 5458 4985 4979 4960 4950 4937 4927 4920 4898 4870 4843 4685 4621 4492 4428 4421 4392 2777 2486 2467 2297 2150 2231 2104 2106 2314 2133 921 906 894 878 748 737 230 15 3 5396 5330 5292 5197 5058 5044 196 200 208 204 192"
          for id in $ids; do
            curl -sfL -A "Mozilla/5.0" "https://kepler.by/wp-content/uploads/elementor/css/post-$id.css" -o "src/wp/css/post-$id.css" || rm -f "src/wp/css/post-$id.css"
          done
          ls src/wp/css | wc -l
      - name: Скачать картинки
        run: |
          python3 - <<'PY'
          import re, os, glob, urllib.request, urllib.parse
          urls = set()
          for f in glob.glob('src/wp/css/*.css'):
              urls |= set(re.findall(r'url\(["\']?(https://kepler\.by/wp-content/uploads/[^"\')]+)', open(f, encoding='utf-8', errors='ignore').read()))
          for f in glob.glob('content/pages/*.json') + ['src/image-urls.txt']:
              if os.path.exists(f):
                  urls |= set(re.findall(r'https://kepler\.by/wp-content/uploads/[^"\s\\<>]+', open(f, encoding='utf-8').read()))
          ok = 0
          for u in sorted(urls):
              path = urllib.parse.unquote(urllib.parse.urlparse(u).path).lstrip('/')
              if '/elementor/' in path:
                  continue
              os.makedirs(os.path.dirname(path), exist_ok=True)
              try:
                  req = urllib.request.Request(urllib.parse.quote(u, safe=':/%'), headers={'User-Agent': 'Mozilla/5.0'})
                  open(path, 'wb').write(urllib.request.urlopen(req, timeout=30).read()); ok += 1
              except Exception as e:
                  print('FAIL', u, e)
          print('images', ok, 'of', len(urls))
          PY
      - name: Сохранить в репозиторий
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Выгрузка CSS и картинок с WordPress
          file_pattern: 'src/wp wp-content'
